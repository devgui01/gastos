<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gastos</title>
  <meta name="description" content="Seu painel de gastos — moderno, animado e 100% offline." />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div id="app">
    <header class="top">
      <div class="title-row">
        <div>
          <h1 class="title">Gastos</h1>
          <div class="subtitle" id="todayLabel">Hoje</div>
        </div>
        <button id="installBtn" class="install-btn" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Instalar
        </button>
      </div>

      <div class="total-card">
        <div class="total-left">
          <div class="total-label">Total gasto</div>
          <div class="total-value" id="total">R$ 0,00</div>
          <div class="total-sub"><span id="countPills">0</span> lançamentos</div>
        </div>
        <div class="total-ring">
          <canvas id="ring" width="120" height="120"></canvas>
          <div class="total-ring-center"><span id="ringPct">0%</span></div>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="panel-head">
          <h2>Últimos 7 dias</h2>
          <span class="panel-tag" id="weekTotal"></span>
        </div>
        <div class="bars" id="bars"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Por categoria</h2></div>
        <div class="donut-wrap">
          <div class="donut">
            <canvas id="donut" width="180" height="180"></canvas>
            <div class="donut-center"><span class="donut-total" id="donutTotal">R$ 0</span><span class="donut-cap">total</span></div>
          </div>
          <div class="legend" id="legend"></div>
        </div>
      </section>

      <section class="panel form-panel">
        <div class="panel-head"><h2>Novo gasto</h2></div>
        <input id="description" type="text" placeholder="Descrição (ex.: Almoço)" autocomplete="off" />
        <div class="row">
          <div class="field">
            <span class="field-cap">Valor</span>
            <div class="amount-box"><span class="cur">R$</span><input id="amount" type="text" inputmode="decimal" placeholder="0,00" /></div>
          </div>
          <div class="field">
            <span class="field-cap">Data</span>
            <input id="date" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" />
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <button id="addBtn" class="add-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          Adicionar
        </button>
      </section>

      <section class="list-section">
        <div class="list-head"><h2>Seus gastos</h2><span id="listCount"></span></div>
        <div id="list"></div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <div id="iosHint" class="ios-hint" hidden>
      Instalar: toque em <strong>Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong>.
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
